version: '3.8'

services:
  user-service:
    build:
      context: ./Backend/UserService
      dockerfile: Dockerfile
    image: matchmakers-user-service:latest
    container_name: user-service
    ports:
      - "8081:8081"
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JAVA_TOOL_OPTIONS=-Xms96m -Xmx192m -XX:TieredStopAtLevel=1 -Dspring.main.lazy-initialization=true
    deploy:
      resources:
        limits:
          memory: 256M

  reclamation-service:
    build:
      context: ./Backend/ReclamationService
      dockerfile: Dockerfile
    image: matchmakers-reclamation-service:latest
